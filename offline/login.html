<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEX OFF - Login</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .main-flex {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 120px;
            height: 100vh;
        }

        .login-container {
            background: rgba(20, 20, 20, 0.95);
            padding: 32px;
            border: 1px solid #fff;
            border-radius: 12px;
            box-shadow: 0 0 24px 2px #fff;
            text-align: center;
            width: 280px;
            margin-left: -32px;
            animation: fadeIn 0.5s ease;
        }

        .demo-account {
            width: 90%;
            margin: 0 auto 16px;
            padding: 14px 12px;
            border: 1px dashed rgba(59, 182, 244, 0.6);
            border-radius: 8px;
            background: rgba(41, 98, 255, 0.08);
            text-align: left;
            font-size: 13px;
            color: #ddd;
        }

        .demo-account h2 {
            margin: 0 0 6px;
            font-size: 15px;
            color: #fff;
            text-align: center;
        }

        .demo-account p {
            margin: 0 0 8px;
            font-size: 12px;
            color: #bbb;
            text-align: center;
            line-height: 1.4;
        }

        .demo-account .demo-credential {
            margin: 4px 0;
            font-family: Consolas, 'Segoe UI', monospace;
        }

        .demo-account .demo-credential strong {
            color: #ced2d7;
            font-weight: 600;
        }

        button.demo-btn {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            font-size: 14px;
            background: rgba(59, 182, 244, 0.15);
            color: #3bb6f4;
            border: 1px solid rgba(59, 182, 244, 0.5);
        }

        button.demo-btn:hover {
            background: rgba(59, 182, 244, 0.25);
            box-shadow: 0 4px 12px rgba(59, 182, 244, 0.2);
        }

        .login-form input:disabled,
        .login-form button:disabled {
            opacity: 0.85;
        }

        .auth-error {
            width: 90%;
            margin: 0 auto 8px;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.55);
            color: #ffb4bc;
            font-size: 13px;
            line-height: 1.35;
            text-align: center;
            display: none;
        }

        .auth-error.visible {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo h1 {
            margin: 0;
            font-size: 28px;
            color: #fff;
            text-shadow: 0 0 12px #fff;
        }

        .logo p {
            font-size: 12px;
            color: #ccc;
            margin-bottom: 30px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .input-container {
            position: relative;
            margin: 20px 0;
            width: 90%;
        }

        .login-form input {
            width: 100%;
            padding: 12px 15px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #808080;
            border-radius: 8px;
            color: #fff;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .login-form input:focus {
            outline: none;
            border: 2px solid #808080;
            box-shadow: 0 0 8px rgba(128, 128, 128, 0.5);
        }

        .login-form input::placeholder {
            color: transparent;
        }

        .input-container label {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #ccc;
            font-size: 15px;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .login-form input:focus + label,
        .login-form input:not(:placeholder-shown) + label {
            top: -10px;
            left: 10px;
            font-size: 12px;
            color: #ced2d7;
            background: rgba(20, 20, 20, 0.95);
            padding: 0 5px;
        }

        button {
            width: 90%;
            padding: 12px;
            margin-top: 16px;
            font-size: 15px;
            background: linear-gradient(135deg, #2962ff, #0039cb);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(41, 98, 255, 0.3);
        }

        .form-toggle {
            margin-top: 10px;
            text-align: center;
            color: #ccc;
            font-size: 14px;
        }

        .form-toggle a {
            color: #3bb6f4;
            text-decoration: none;
            cursor: pointer;
        }

        .form-toggle a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
  
     

        .robot-container {
  position: relative;
  width: 700px;
  height: 620px;
}

.speech-bubble {
  display: none;
  position: absolute;
  top: 20%;
  right: 85%;
  transform: translateY(-50%);
  margin-right: 20px;
  background: rgba(20, 20, 20, 0.95);
  padding: 12px 20px;
  border-radius: 8px;
  border: 1px solid #fff;
  box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
  font-size: 14px;
  color: #fff;
  animation: fadeIn 0.3s ease;
  z-index: 1000;
}

.speech-bubble::after {
  content: '';
  position: absolute;
  top: 50%;
  right: -8px;
  transform: translateY(-50%);
  border-width: 8px 0 8px 8px;
  border-style: solid;
  border-color: transparent transparent transparent rgba(20, 20, 20, 0.95);
}

        spline-viewer::part(branding) {
            display: none !important;
        }

        spline-viewer::part(branding) {
            right: 10px !important;
            left: auto !important;
            bottom: 10px !important;
            top: auto !important;
        }

    </style>
</head>
<body>
     <div class="main-flex">
        <div class="robot-container">
            <div class="speech-bubble">Hello, User!</div>
          
            <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.96/build/spline-viewer.js"></script>
            <spline-viewer url="https://prod.spline.design/X3P3pLMkHGhTc1YZ/scene.splinecode"></spline-viewer>
          </div>
          
        <div class="login-container">
            <div class="logo">
                <h1>NEX OFF</h1>
                <p>AI That Works Beyond the Internet</p>
            </div>

            <div id="login-demo-section" class="demo-account">
                <h2>Demo Account</h2>
                <p>Use the credentials below to explore NEX_OFF.</p>
                <p class="demo-credential"><strong>Username:</strong> demo</p>
                <p class="demo-credential"><strong>Password:</strong> Demo@123</p>
                <button type="button" id="use-demo-account" class="demo-btn">Use Demo Account</button>
            </div>

            <form id="login-form" class="login-form">
                <div id="login-error" class="auth-error" role="alert" aria-live="polite"></div>
                <div class="input-container">
                    <input type="text" id="login-username" name="username" placeholder=" " required autocomplete="username" />
                    <label>Username</label>
                </div>
                <div class="input-container">
                    <input type="password" id="login-password" placeholder=" " required autocomplete="current-password" />
                    <label>Password</label>
                </div>
                <button type="submit" id="login-submit">Login</button>
                <p class="form-toggle">Don't have an account? <a onclick="toggleForm('signup')">Sign Up</a></p>
            </form>

            <form id="signup-form" class="login-form hidden">
                <div id="signup-error" class="auth-error" role="alert" aria-live="polite"></div>
                <div class="input-container">
                    <input type="text" placeholder=" " required />
                    <label>Username</label>
                </div>
                <div class="input-container">
                    <input type="email" placeholder=" " required />
                    <label>Email</label>
                </div>
                <div class="input-container">
                    <input type="password" placeholder=" " required />
                    <label>Password</label>
                </div>
                <div class="input-container">
                    <input type="password" placeholder=" " required />
                    <label>Confirm Password</label>
                </div>
                <button type="submit">Sign Up</button>
                <p class="form-toggle">Already have an account? <a onclick="toggleForm('login')">Login</a></p>
            </form>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const DEMO_USERNAME = 'demo';
        const DEMO_PASSWORD = 'Demo@123';

        let loginAttemptInFlight = false;
        let signupAttemptInFlight = false;
        let activeAuthMode = 'login';

        function toggleForm(formType) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const loginDemoSection = document.getElementById('login-demo-section');
            const speechBubble = document.querySelector('.speech-bubble');

            if (formType === 'signup') {
                loginForm.classList.add('hidden');
                loginDemoSection.classList.add('hidden');
                signupForm.classList.remove('hidden');
                speechBubble.textContent = 'Create your account!';
                activeAuthMode = 'signup';
                hideAuthError('login');
            } else {
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                loginDemoSection.classList.remove('hidden');
                speechBubble.textContent = 'Welcome back!';
                activeAuthMode = 'login';
                hideAuthError('signup');
            }
            speechBubble.style.display = 'block';
        }

        function showAuthError(formType, message) {
            const el = document.getElementById(formType === 'login' ? 'login-error' : 'signup-error');
            if (!el) return;
            el.textContent = message;
            el.classList.add('visible');
        }

        function hideAuthError(formType) {
            const el = document.getElementById(formType === 'login' ? 'login-error' : 'signup-error');
            if (!el) return;
            el.textContent = '';
            el.classList.remove('visible');
        }

        function resetLoginFormInteractionState() {
            const loginUsernameInput = document.getElementById('login-username');
            const loginPasswordInput = document.getElementById('login-password');
            const loginSubmitBtn = document.getElementById('login-submit');

            loginAttemptInFlight = false;

            if (loginUsernameInput) {
                loginUsernameInput.disabled = false;
                loginUsernameInput.readOnly = false;
            }
            if (loginPasswordInput) {
                loginPasswordInput.disabled = false;
                loginPasswordInput.readOnly = false;
            }
            if (loginSubmitBtn) {
                loginSubmitBtn.disabled = false;
            }
        }

        function resetSignupFormInteractionState() {
            const signupSubmitBtn = document.querySelector('#signup-form button[type="submit"]');
            const signupInputs = document.querySelectorAll('#signup-form input');

            signupAttemptInFlight = false;

            signupInputs.forEach((input) => {
                input.disabled = false;
                input.readOnly = false;
            });
            if (signupSubmitBtn) {
                signupSubmitBtn.disabled = false;
            }
        }

        function fillDemoCredentials() {
            const loginUsernameInput = document.getElementById('login-username');
            const loginPasswordInput = document.getElementById('login-password');

            loginUsernameInput.value = DEMO_USERNAME;
            loginPasswordInput.value = DEMO_PASSWORD;
            hideAuthError('login');
            updateSpeechBubble(DEMO_USERNAME, false);

            loginUsernameInput.dispatchEvent(new Event('input', { bubbles: true }));
            loginPasswordInput.dispatchEvent(new Event('input', { bubbles: true }));

            loginUsernameInput.focus();
        }

        function updateSpeechBubble(username, isTyping) {
            const speechBubble = document.querySelector('.speech-bubble');
            if (isTyping) {
                speechBubble.style.display = 'block';
                speechBubble.textContent = 'Hello, User!';
            } else if (username.trim()) {
                speechBubble.style.display = 'block';
                speechBubble.textContent = `Hello, ${username}!`;
            } else {
                speechBubble.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const loginUsernameInput = document.getElementById('login-username');
            const loginPasswordInput = document.getElementById('login-password');
            const loginSubmitBtn = document.getElementById('login-submit');
            const signupUsernameInput = document.querySelector('#signup-form input[type="text"]');
            const useDemoBtn = document.getElementById('use-demo-account');
            let typingTimeout;

            resetLoginFormInteractionState();
            resetSignupFormInteractionState();

            useDemoBtn.addEventListener('click', () => {
                fillDemoCredentials();
            });

            function handleTyping(e, input) {
                clearTimeout(typingTimeout);
                if (input === loginUsernameInput || input === loginPasswordInput) {
                    hideAuthError('login');
                }
                updateSpeechBubble('', true);
                typingTimeout = setTimeout(() => {
                    updateSpeechBubble(input.value, false);
                }, 1000);
            }

            loginUsernameInput.addEventListener('input', (e) => handleTyping(e, loginUsernameInput));
            loginPasswordInput.addEventListener('input', (e) => handleTyping(e, loginPasswordInput));
            signupUsernameInput.addEventListener('input', (e) => handleTyping(e, signupUsernameInput));

            [loginUsernameInput, signupUsernameInput].forEach(input => {
                input.addEventListener('blur', () => {
                    if (!input.value.trim()) {
                        updateSpeechBubble('', false);
                    }
                });
            });

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (loginAttemptInFlight) {
                    return;
                }

                const username = loginUsernameInput.value.trim();
                const password = loginPasswordInput.value;

                hideAuthError('login');
                loginAttemptInFlight = true;
                loginSubmitBtn.disabled = true;

                ipcRenderer.send('login-attempt', { username, password });
            });

            signupForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (signupAttemptInFlight) {
                    return;
                }

                const username = signupUsernameInput.value;
                const email = signupForm.querySelector('input[type="email"]').value;
                const password = signupForm.querySelectorAll('input[type="password"]')[0].value;
                const confirmPassword = signupForm.querySelectorAll('input[type="password"]')[1].value;

                hideAuthError('signup');

                if (password !== confirmPassword) {
                    showAuthError('signup', 'Passwords do not match!');
                    return;
                }

                signupAttemptInFlight = true;
                signupForm.querySelector('button[type="submit"]').disabled = true;
                ipcRenderer.send('signup-attempt', { username, email, password });
            });
        });

        ipcRenderer.removeAllListeners('auth-response');
        ipcRenderer.on('auth-response', (event, { success, message }) => {
            if (activeAuthMode === 'signup') {
                resetSignupFormInteractionState();
                if (success) {
                    window.location.href = 'index.html';
                } else {
                    showAuthError('signup', message);
                }
                return;
            }

            resetLoginFormInteractionState();

            if (success) {
                window.location.href = 'index.html';
            } else {
                showAuthError('login', message);
                const loginPasswordInput = document.getElementById('login-password');
                if (loginPasswordInput) {
                    loginPasswordInput.value = '';
                    loginPasswordInput.focus();
                }
            }
        });
    </script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
